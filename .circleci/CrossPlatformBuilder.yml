version: 2.1
orbs:
  matlab: mathworks/matlab@1.3.0

executors:
  linux:
    machine:
      image: default
  macos:
    macos:
      xcode: 14.2.0
  windows:
    resource_class: "windows.medium"
    machine:
      image: 'windows-server-2022-gui:current'
      shell: "powershell.exe -ExecutionPolicy Bypass"

jobs:
  build_and_deploy:
    parameters:
      os:
        type: executor
      release:
        type: string
    executor: << parameters.os >>
    steps:
      - checkout

      - matlab/install:
          release: << parameters.release >>
          products: >
            MATLAB_Compiler_SDK
            MATLAB_Test

      # Extract and Add MATLAB runtime to PATH for Windows
      - run:
          name: Extract and Add MATLAB runtime to PATH for Windows
          command: |
            if ("<< parameters.os >>" -eq "windows") {
              $matlab_root = matlab -batch "disp(matlabroot)" | Select-String -Pattern '.*'
              $env:PATH = "$env:PATH;$matlab_root\runtime\win64"
            }

      # Step to verify that the MATLAB_RUNTIME_PATH is set
      - run:
          name: Verify MATLAB_RUNTIME_PATH
          command: |
            echo "The updated PATH is: $PATH"
          
      # Compiles MATLAB function for deployment
      - matlab/run-command:
          command: |
            mex src/arrayProduct.c;
            addpath(genpath(pwd));
            buildResults = compiler.build.pythonPackage("src/KgToPounds.m", OutputDir = "KgToPoundsPythonBuild");
            save("pythonBuild.mat","buildResults");
            results = runtests("tests/KgToPoundsEquivalenceTest.m");
            assertSuccess(results);

      - store_artifacts:
          path: KgToPoundsPythonBuild

workflows:
  build_and_deploy_python_package:
    jobs:
      - build_and_deploy:
          matrix:
            parameters:
              os: [linux, macos, windows]
              release: ["R2024a", "R2024b"] 