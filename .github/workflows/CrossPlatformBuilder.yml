name: Build and Deploy Python Package
 
on:
  push:
    branches: [ integrateGenerateExecutable ]
 
  workflow_dispatch:
 
# Utilizes repository-stored secrets for MATLAB's batch-token licensing
env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
 
jobs:
  # This workflow contains a single job called "build-and-deploy"
  build-and-deploy:
     
    # A job will run for all combinations of OS and release present in the matrix
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: [R2024a, R2024b]
 
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
 
    steps:
      - uses: actions/checkout@v3

      - name: Download updated setup-matlab
        id: download-artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow_search: true
          commit: 94e87238756845a653cac6251e89d8e549529ecb
          name: built-action

      - name: install products using updated setup-matlab
        uses: ./
        with:
          release: ${{ matrix.release }}
          products: >
            MATLAB_Compiler_SDK
            MATLAB_Test
       
      # # Sets up MATLAB on the GitHub Actions runner using setup-matlab@v2 and download MATLAB_Compiler_SDK
      # - name: Setup MATLAB
      #   id: setup-matlab
      #   uses: matlab-actions/setup-matlab@94e87238756845a653cac6251e89d8e549529ecb
      #   with:
      #     release: ${{ matrix.release }}
      #     products: >
      #       MATLAB_Compiler_SDK
      #       MATLAB_Test

      # Installs Python and add it to the Path
      - name: Setup Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'

      # - name: Add MATLAB runtime to PATH for Windows
      #   if: matrix.os == 'windows-latest'
      #   run: |
      #     echo "PATH=$env:PATH;${{ steps.setup-matlab.outputs.matlabroot }}\runtime\win64" >> $env:GITHUB_ENV
      #   shell: pwsh
 
      # Compiles MATLAB function for deployment
      - name: Compile
        uses: matlab-actions/run-command@v2
        with:
          command: |
            mex src/arrayProduct.c;
            addpath(genpath(pwd));
            buildResults = compiler.build.pythonPackage("src/KgToPounds.m", OutputDir = "KgToPoundsPythonBuild");
            save("pythonBuild.mat","buildResults");

      - name: Run equivalence tests
        uses: matlab-actions/run-tests@v2
        with:
          select-by-tag: EquivalenceTest
          source-folder: ../

      # Uploads the generated executable as an artifact to GitHub
      - name: Upload generated binary
        uses: actions/upload-artifact@v4
        with:
          name: KgToPounds-${{ matrix.release }}-${{ matrix.os }}
          path: KgToPounds*